# Clean Voice release (B019): on a pushed tag vX.Y.Z, the tag is checked against the app version, then the whole CI workflow
# runs (checks, the MSI and the universal DMG with their launch checks, Intel included, and the install command run for
# real on Windows and both Macs), then a GitHub Release is made under stable names, so releases/latest/download/<name> is
# a permanent link: the installers and their checksum files (the in-app updater verifies them), the source zip (git
# archive of the tag) and the two install scripts, stamped with the version and the zip's SHA-256. Last, the download
# page is deployed: only after the release exists, so the page never shows a link whose file is not there yet.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # A tag that is not the app version fails here in seconds, before the long CI run.
  tag:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag is the app version
        run: python tools/ci/release_assets.py --check-only --tag "$GITHUB_REF_NAME"

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  # macOS so git archive and the stamped scripts keep Unix line endings (install.sh runs under bash).
  release:
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release script is standard library only: no install.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clean-voice-windows-msi
          path: artifacts/msi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clean-voice-macos-dmg
          path: artifacts/dmg
      - name: Source archive of the tag
        run: git archive --format=zip -o Clean-Voice-source.zip "$GITHUB_REF_NAME"
      - name: Stable names, checksums and stamped scripts
        run: >-
          python tools/ci/release_assets.py release --msi artifacts/msi --dmg artifacts/dmg
          --source Clean-Voice-source.zip --tag "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "Clean Voice $GITHUB_REF_NAME" --generate-notes --verify-tag

  # A release made with GITHUB_TOKEN does not trigger a `release: published` workflow (GitHub docs, "Triggering a
  # workflow"), so the page is deployed by an explicit call. A called workflow cannot hold more permissions than its
  # caller job, so the job grants the three that pages.yml's deploy job asks for.
  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
